<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 880" font-family="'Segoe UI',Arial,sans-serif">
  <style>
    .card{fill:#fbfcfd;stroke:#d3dade;stroke-width:1.4;}
    .nm{fill:#1f2d3a;font-size:16px;font-weight:bold;}
    .sp{fill:#5a6b78;font-size:12.5px;}
    .pr{fill:#d35400;font-size:12.5px;font-weight:bold;}
    .hd{fill:#d35400;font-size:22px;font-weight:bold;}
    .sub{fill:#5a6b78;font-size:13px;}
  </style>
  <text x="24" y="34" class="hd">Bill of Materials — visual parts list</text>
  <text x="24" y="56" class="sub">Every component of the climate cabinet. Icons are schematic. Prices are typical USD estimates.</text>

  <!-- ROW templates: 4 cols x 4 rows. col x: 24,298,572,846 (w255). row y:74,269,464,659 (h175) -->

  <!-- 1 Baltic birch carcass -->
  <g><rect class="card" x="24" y="74" width="255" height="175" rx="9"/>
    <svg x="40" y="129" width="64" height="64" viewBox="0 0 64 64">
      <rect x="6" y="16" width="52" height="32" fill="#e9d8b8" stroke="#7a5f37" stroke-width="2"/>
      <line x1="6" y1="22" x2="58" y2="22" stroke="#c2a468" stroke-width="1.4"/>
      <line x1="6" y1="28" x2="58" y2="28" stroke="#c2a468" stroke-width="1.4"/>
      <line x1="6" y1="34" x2="58" y2="34" stroke="#c2a468" stroke-width="1.4"/>
      <line x1="6" y1="40" x2="58" y2="40" stroke="#c2a468" stroke-width="1.4"/>
    </svg>
    <text x="116" y="118" class="nm">Baltic birch ply</text>
    <text x="116" y="140" class="sp">Carcass ¾&quot; + back ½&quot;</text>
    <text x="116" y="158" class="sp">Cut to size by dealer</text>
    <text x="116" y="178" class="pr">part of ~$885</text>
  </g>

  <!-- 2 Cherry frames -->
  <g><rect class="card" x="298" y="74" width="255" height="175" rx="9"/>
    <svg x="314" y="129" width="64" height="64" viewBox="0 0 64 64">
      <rect x="8" y="8" width="48" height="48" fill="none" stroke="#8a4b2f" stroke-width="8"/>
    </svg>
    <text x="390" y="118" class="nm">Cherry frames</text>
    <text x="390" y="140" class="sp">1×2 face + 1×3 door</text>
    <text x="390" y="158" class="sp">~4 boards (8′)</text>
    <text x="390" y="178" class="pr">part of ~$885</text>
  </g>

  <!-- 3 Tempered glass -->
  <g><rect class="card" x="572" y="74" width="255" height="175" rx="9"/>
    <svg x="588" y="129" width="64" height="64" viewBox="0 0 64 64">
      <rect x="12" y="6" width="40" height="52" rx="3" fill="#cfe8f5" stroke="#3a86a8" stroke-width="2.2"/>
      <line x1="20" y1="14" x2="30" y2="14" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="20" y1="20" x2="26" y2="20" stroke="#ffffff" stroke-width="2"/>
    </svg>
    <text x="664" y="118" class="nm">Tempered glass</text>
    <text x="664" y="140" class="sp">~37×52, clear</text>
    <text x="664" y="158" class="sp">Pencil-polished edges</text>
    <text x="664" y="178" class="pr">~$384</text>
  </g>

  <!-- 4 Piano hinge -->
  <g><rect class="card" x="846" y="74" width="255" height="175" rx="9"/>
    <svg x="862" y="129" width="64" height="64" viewBox="0 0 64 64">
      <rect x="18" y="6" width="12" height="52" fill="#c9ccd1" stroke="#7c828a" stroke-width="1.5"/>
      <rect x="34" y="6" width="12" height="52" fill="#dde0e4" stroke="#7c828a" stroke-width="1.5"/>
      <circle cx="32" cy="14" r="4.5" fill="#aeb3ba" stroke="#7c828a"/>
      <circle cx="32" cy="28" r="4.5" fill="#aeb3ba" stroke="#7c828a"/>
      <circle cx="32" cy="42" r="4.5" fill="#aeb3ba" stroke="#7c828a"/>
      <circle cx="32" cy="54" r="4.5" fill="#aeb3ba" stroke="#7c828a"/>
    </svg>
    <text x="938" y="118" class="nm">Piano hinge</text>
    <text x="938" y="140" class="sp">Continuous, 48–60&quot;</text>
    <text x="938" y="158" class="sp">Stiff door support</text>
    <text x="938" y="178" class="pr">~$25</text>
  </g>

  <!-- 5 Compression latches -->
  <g><rect class="card" x="24" y="269" width="255" height="175" rx="9"/>
    <svg x="40" y="324" width="64" height="64" viewBox="0 0 64 64">
      <rect x="8" y="24" width="22" height="16" rx="2" fill="#cfd3d8" stroke="#7c828a" stroke-width="1.6"/>
      <path d="M30 32 h14 a6 6 0 0 1 6 6 v4" fill="none" stroke="#5a6b78" stroke-width="3"/>
      <rect x="44" y="42" width="12" height="6" rx="2" fill="#9aa1a8" stroke="#7c828a"/>
    </svg>
    <text x="116" y="313" class="nm">Draw latches ×3</text>
    <text x="116" y="335" class="sp">Compress door gasket</text>
    <text x="116" y="353" class="sp">Not magnetic catches</text>
    <text x="116" y="373" class="pr">~$20</text>
  </g>

  <!-- 6 Door pull -->
  <g><rect class="card" x="298" y="269" width="255" height="175" rx="9"/>
    <svg x="314" y="324" width="64" height="64" viewBox="0 0 64 64">
      <rect x="14" y="28" width="36" height="7" rx="3.5" fill="#3a4149"/>
      <rect x="16" y="35" width="5" height="9" fill="#3a4149"/>
      <rect x="43" y="35" width="5" height="9" fill="#3a4149"/>
    </svg>
    <text x="390" y="313" class="nm">Door pull</text>
    <text x="390" y="335" class="sp">Bar/knob handle</text>
    <text x="390" y="353" class="sp">Your finish choice</text>
    <text x="390" y="373" class="pr">~$12</text>
  </g>

  <!-- 7 Guitar hangers -->
  <g><rect class="card" x="572" y="269" width="255" height="175" rx="9"/>
    <svg x="588" y="324" width="64" height="64" viewBox="0 0 64 64">
      <rect x="28" y="8" width="8" height="20" rx="2" fill="#7c5a3a"/>
      <path d="M32 28 C 18 30 16 44 24 50" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
      <path d="M32 28 C 46 30 48 44 40 50" fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <text x="664" y="313" class="nm">Guitar hangers ×8</text>
    <text x="664" y="335" class="sp">Wood wall-mount</text>
    <text x="664" y="353" class="sp">(String Swing-type)</text>
    <text x="664" y="373" class="pr">~$145</text>
  </g>

  <!-- 8 Spanish cedar lining -->
  <g><rect class="card" x="846" y="269" width="255" height="175" rx="9"/>
    <svg x="862" y="324" width="64" height="64" viewBox="0 0 64 64">
      <rect x="8" y="10" width="11" height="44" fill="#c8895a" stroke="#9a6238" stroke-width="1.2"/>
      <rect x="20" y="10" width="11" height="44" fill="#d2966a" stroke="#9a6238" stroke-width="1.2"/>
      <rect x="32" y="10" width="11" height="44" fill="#c0814f" stroke="#9a6238" stroke-width="1.2"/>
      <rect x="44" y="10" width="11" height="44" fill="#cf9265" stroke="#9a6238" stroke-width="1.2"/>
    </svg>
    <text x="938" y="313" class="nm">Spanish cedar</text>
    <text x="938" y="335" class="sp">¼&quot; vault lining</text>
    <text x="938" y="353" class="sp">~35–40 sq ft</text>
    <text x="938" y="373" class="pr">~$150</text>
  </g>

  <!-- 9 Controller 79 -->
  <g><rect class="card" x="24" y="464" width="255" height="175" rx="9"/>
    <svg x="40" y="519" width="64" height="64" viewBox="0 0 64 64">
      <rect x="6" y="14" width="52" height="36" rx="3" fill="#1c2025" stroke="#000" stroke-width="1.5"/>
      <rect x="11" y="19" width="26" height="18" rx="2" fill="#27ae60"/>
      <circle cx="46" cy="24" r="4" fill="#3a4149" stroke="#555"/>
      <circle cx="46" cy="36" r="4" fill="#3a4149" stroke="#555"/>
    </svg>
    <text x="116" y="503" class="nm">AC Infinity 79</text>
    <text x="116" y="525" class="sp">Outlet controller</text>
    <text x="116" y="543" class="sp">Fans+RH+app+alarms</text>
    <text x="116" y="563" class="pr">~$110</text>
  </g>

  <!-- 10 Fans -->
  <g><rect class="card" x="298" y="464" width="255" height="175" rx="9"/>
    <svg x="314" y="519" width="64" height="64" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="24" fill="#eef1f3" stroke="#7c828a" stroke-width="2"/>
      <g fill="#9aa1a8">
        <path d="M32 32 C 40 14 52 22 32 32"/>
        <path d="M32 32 C 50 40 42 52 32 32"/>
        <path d="M32 32 C 24 50 12 42 32 32"/>
        <path d="M32 32 C 14 24 22 12 32 32"/>
      </g>
      <circle cx="32" cy="32" r="5" fill="#5a6b78"/>
    </svg>
    <text x="390" y="503" class="nm">Circulation fans ×2</text>
    <text x="390" y="525" class="sp">120 mm, variable</text>
    <text x="390" y="543" class="sp">Run by the 79</text>
    <text x="390" y="563" class="pr">~$70</text>
  </g>

  <!-- 11 Humidifier -->
  <g><rect class="card" x="572" y="464" width="255" height="175" rx="9"/>
    <svg x="588" y="519" width="64" height="64" viewBox="0 0 64 64">
      <rect x="18" y="26" width="28" height="30" rx="4" fill="#bfe3ef" stroke="#3a86a8" stroke-width="1.8"/>
      <rect x="28" y="18" width="8" height="10" fill="#9fd3e6"/>
      <path d="M30 16 q3 -4 0 -8 M34 16 q3 -4 0 -8" fill="none" stroke="#7fb8cf" stroke-width="2"/>
    </svg>
    <text x="664" y="503" class="nm">Cool-mist humidifier</text>
    <text x="664" y="525" class="sp">Distilled water</text>
    <text x="664" y="543" class="sp">On a 79 outlet</text>
    <text x="664" y="563" class="pr">~$40</text>
  </g>

  <!-- 12 Dehumidifier -->
  <g><rect class="card" x="846" y="464" width="255" height="175" rx="9"/>
    <svg x="862" y="519" width="64" height="64" viewBox="0 0 64 64">
      <rect x="14" y="14" width="36" height="38" rx="4" fill="#e7eaed" stroke="#7c828a" stroke-width="1.8"/>
      <path d="M32 22 C 26 30 24 36 32 40 C 40 36 38 30 32 22 Z" fill="#3a86a8"/>
    </svg>
    <text x="938" y="503" class="nm">Mini dehumidifier</text>
    <text x="938" y="525" class="sp">Peltier / desiccant</text>
    <text x="938" y="543" class="sp">On a 79 outlet</text>
    <text x="938" y="563" class="pr">~$45</text>
  </g>

  <!-- 13 SensorPush -->
  <g><rect class="card" x="24" y="659" width="255" height="175" rx="9"/>
    <svg x="40" y="714" width="64" height="64" viewBox="0 0 64 64">
      <rect x="18" y="22" width="28" height="28" rx="6" fill="#f2f4f6" stroke="#7c828a" stroke-width="1.8"/>
      <path d="M22 18 a14 14 0 0 1 20 0" fill="none" stroke="#27ae60" stroke-width="2.4"/>
      <path d="M26 14 a8 8 0 0 1 12 0" fill="none" stroke="#27ae60" stroke-width="2.4"/>
    </svg>
    <text x="116" y="703" class="nm">Remote monitor</text>
    <text x="116" y="725" class="sp">SensorPush-type</text>
    <text x="116" y="743" class="sp">Independent RH alarm</text>
    <text x="116" y="763" class="pr">~$50</text>
  </g>

  <!-- 14 Power & cabling -->
  <g><rect class="card" x="298" y="659" width="255" height="175" rx="9"/>
    <svg x="314" y="714" width="64" height="64" viewBox="0 0 64 64">
      <rect x="8" y="24" width="48" height="16" rx="3" fill="#2b2b2b"/>
      <circle cx="18" cy="32" r="2.4" fill="#cfd3d8"/><circle cx="30" cy="32" r="2.4" fill="#cfd3d8"/>
      <circle cx="42" cy="32" r="2.4" fill="#cfd3d8"/><rect x="50" y="29" width="6" height="6" fill="#e74c3c"/>
      <circle cx="9" cy="46" r="6" fill="none" stroke="#9aa1a8" stroke-width="2"/>
    </svg>
    <text x="390" y="703" class="nm">Power &amp; cabling</text>
    <text x="390" y="725" class="sp">GFCI strip, grommet,</text>
    <text x="390" y="743" class="sp">raceway, drip loops</text>
    <text x="390" y="763" class="pr">~$65</text>
  </g>

  <!-- 15 Sealing kit -->
  <g><rect class="card" x="572" y="659" width="255" height="175" rx="9"/>
    <svg x="588" y="714" width="64" height="64" viewBox="0 0 64 64">
      <rect x="10" y="26" width="34" height="12" rx="2" fill="#dfe3e7" stroke="#7c828a" stroke-width="1.4"/>
      <path d="M44 28 l10 -6 v12 z" fill="#b7bdc4"/>
      <circle cx="22" cy="50" r="8" fill="none" stroke="#7c5a3a" stroke-width="4"/>
    </svg>
    <text x="664" y="703" class="nm">Sealing kit</text>
    <text x="664" y="725" class="sp">Caulk, neutral silicone,</text>
    <text x="664" y="743" class="sp">EPDM, glazing tape</text>
    <text x="664" y="763" class="pr">~$70</text>
  </g>

  <!-- 16 Anti-tip -->
  <g><rect class="card" x="846" y="659" width="255" height="175" rx="9"/>
    <svg x="862" y="714" width="64" height="64" viewBox="0 0 64 64">
      <path d="M16 14 v36 h32" fill="none" stroke="#5a6b78" stroke-width="6"/>
      <circle cx="16" cy="22" r="2.6" fill="#3a4149"/><circle cx="16" cy="42" r="2.6" fill="#3a4149"/>
      <circle cx="40" cy="50" r="2.6" fill="#3a4149"/>
    </svg>
    <text x="938" y="703" class="nm">Anti-tip brackets</text>
    <text x="938" y="725" class="sp">Anchor to studs</text>
    <text x="938" y="743" class="sp">Safety-critical</text>
    <text x="938" y="763" class="pr">~$12</text>
  </g>
</svg>
