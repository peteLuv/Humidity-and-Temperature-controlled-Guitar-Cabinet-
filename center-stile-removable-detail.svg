<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1620" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c0392b"/></marker>
    <marker id="dm" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#34495e"/></marker>
  </defs>
  <style>
    .maple{fill:#f2dfae;stroke:#8a6b30;stroke-width:1.6;}
    .rail{fill:#e6cf9c;stroke:#8a6b30;stroke-width:1.6;}
    .plate{fill:#9aa5ad;stroke:#3d4650;stroke-width:1.8;}
    .mscrew{fill:#c0392b;stroke:#7b1f14;stroke-width:1.4;}
    .wscrew{fill:#4a545c;stroke:#242a2f;stroke-width:1.2;}
    .insert{fill:#d4a017;stroke:#8a6a0c;stroke-width:1.5;}
    .dowel{fill:#c9a069;stroke:#7a5a2e;stroke-width:1.5;}
    .glass{fill:#cfe8f5;stroke:#3a86a8;stroke-width:1.2;opacity:0.4;}
    .h1{fill:#8a4b2f;font-size:21px;font-weight:bold;}
    .ttl{fill:#2c3e50;font-size:15px;font-weight:bold;}
    .nt{fill:#40515c;font-size:12.5px;}
    .red{fill:#c0392b;font-size:12.5px;font-weight:bold;}
    .grn{fill:#1e8449;font-size:12.5px;font-weight:bold;}
    .dim{stroke:#34495e;stroke-width:0.9;}
    .dl{fill:#34495e;font-size:11.5px;}
    .ghost{fill:none;stroke:#c0392b;stroke-width:1.5;stroke-dasharray:5 4;}
  </style>

  <text x="28" y="34" class="h1">Removable center stile — simplified (flat plates, not L-brackets)</text>
  <text x="28" y="56" class="nt">The rail's back and the stile's back are in the SAME plane, so a flat steel strip lies across both. Much simpler than an L.</text>

  <!-- ================= PANEL A — THE PARTS ================= -->
  <text x="34" y="96" class="ttl">A · The only 4 things you need (×2 — one set at the top, one at the bottom)</text>

  <!-- part 1: plate -->
  <rect x="60" y="120" width="150" height="26" rx="4" class="plate"/>
  <circle cx="88" cy="133" r="6" class="wscrew"/><circle cx="120" cy="133" r="6" class="wscrew"/>
  <circle cx="182" cy="133" r="7" class="mscrew"/>
  <text x="60" y="168" class="ttl">1 · Flat mending plate</text>
  <text x="60" y="188" class="nt">~75 mm steel strip. Black if you can get it.</text>
  <text x="60" y="206" class="nt"><tspan class="wscrew" font-weight="bold">●</tspan> 2 wood screws → into the RAIL (permanent)</text>
  <text x="60" y="224" class="nt"><tspan class="mscrew" font-weight="bold">●</tspan> 1 machine screw → into the STILE (removable)</text>

  <!-- part 2: insert -->
  <g transform="translate(330,118)">
    <rect x="0" y="4" width="44" height="26" rx="3" class="insert"/>
    <path d="M4 4 v26 M12 4 v26 M20 4 v26 M28 4 v26 M36 4 v26" stroke="#8a6a0c" stroke-width="1"/>
    <rect x="0" y="10" width="16" height="14" fill="#5a4a10"/>
  </g>
  <text x="330" y="168" class="ttl">2 · Threaded insert</text>
  <text x="330" y="188" class="nt">M5 × 10 mm, hex-drive. A brass sleeve</text>
  <text x="330" y="206" class="nt">buried in the stile — gives it metal threads</text>
  <text x="330" y="224" class="nt">so the screw can come in and out forever.</text>

  <!-- part 3: machine screw -->
  <g transform="translate(620,120)">
    <rect x="0" y="8" width="16" height="16" rx="2" class="mscrew"/>
    <rect x="16" y="12" width="70" height="8" class="mscrew"/>
  </g>
  <text x="620" y="168" class="ttl">3 · Machine screw</text>
  <text x="620" y="188" class="nt">M5, ~14 mm. This is the ONE screw you</text>
  <text x="620" y="206" class="nt">undo to take the stile out.</text>

  <!-- part 4: dowels -->
  <g transform="translate(840,116)">
    <rect x="0" y="6" width="14" height="34" rx="6" class="dowel"/>
    <rect x="30" y="6" width="14" height="34" rx="6" class="dowel"/>
  </g>
  <text x="840" y="168" class="ttl">4 · 2 dowel pins</text>
  <text x="840" y="188" class="nt">6 mm × 20 mm, bottom only.</text>
  <text x="840" y="206" class="nt">Sets the exact position.</text>

  <line x1="34" y1="250" x2="986" y2="250" stroke="#d5dde2" stroke-width="1.5"/>

  <!-- ================= PANEL B — BACK VIEW ================= -->
  <text x="34" y="286" class="ttl">B · BACK VIEW — standing inside the cabinet, looking at the back of the frame</text>
  <text x="34" y="308" class="nt">This is the easiest way to see it: the plate simply lies flat across the seam where the stile meets the rail.</text>

  <!-- top rail -->
  <rect x="120" y="330" width="420" height="60" class="rail"/>
  <text x="330" y="366" text-anchor="middle" class="nt">back of TOP RAIL  (stays put)</text>
  <!-- stile -->
  <rect x="290" y="390" width="80" height="330" class="maple"/>
  <text x="330" y="560" text-anchor="middle" class="nt" transform="rotate(-90 330 560)">back of CENTER STILE  (lifts out)</text>
  <!-- middle rail -->
  <rect x="120" y="720" width="420" height="90" class="rail"/>
  <text x="330" y="770" text-anchor="middle" class="nt">back of MIDDLE RAIL  (stays put)</text>

  <!-- TOP plate bridging -->
  <rect x="300" y="358" width="60" height="70" rx="4" class="plate"/>
  <circle cx="330" cy="374" r="6" class="wscrew"/>
  <circle cx="330" cy="412" r="7" class="mscrew"/>
  <text x="580" y="352" class="red">TOP: plate bridges the seam</text>
  <text x="580" y="372" class="nt"><tspan class="wscrew" font-weight="bold">●</tspan> upper screw bites the RAIL — leave it in forever</text>
  <text x="580" y="392" class="nt"><tspan class="mscrew" font-weight="bold">●</tspan> lower screw goes into the STILE's insert — this is</text>
  <text x="580" y="412" class="nt">the one you undo</text>
  <line x1="575" y1="386" x2="368" y2="392" class="dim" marker-end="url(#ar)"/>

  <!-- BOTTOM plate bridging -->
  <rect x="300" y="686" width="60" height="70" rx="4" class="plate"/>
  <circle cx="330" cy="702" r="7" class="mscrew"/>
  <circle cx="330" cy="740" r="6" class="wscrew"/>
  <!-- dowels at the bottom seam -->
  <circle cx="308" cy="722" r="7" class="dowel"/>
  <circle cx="352" cy="722" r="7" class="dowel"/>
  <text x="580" y="690" class="red">BOTTOM: same plate, plus 2 dowel pins</text>
  <text x="580" y="710" class="nt">The dowels stick UP out of the middle rail. The stile's</text>
  <text x="580" y="730" class="nt">bottom end has 2 matching holes and drops onto them —</text>
  <text x="580" y="750" class="nt">that's what puts it back in exactly the same spot.</text>
  <line x1="575" y1="724" x2="368" y2="722" class="dim" marker-end="url(#ar)"/>

  <line x1="34" y1="850" x2="986" y2="850" stroke="#d5dde2" stroke-width="1.5"/>

  <!-- ================= PANEL C — WHICH PIECE HOLDS WHAT ================= -->
  <text x="34" y="886" class="ttl">C · Your question: is the block on the rail or the stile?  →  Dowels live in the RAIL. Holes are in the STILE.</text>

  <!-- exploded bottom joint -->
  <g transform="translate(120,910)">
    <!-- stile lifted -->
    <rect x="60" y="0" width="90" height="90" class="maple"/>
    <text x="105" y="50" text-anchor="middle" class="nt">STILE</text>
    <text x="105" y="68" text-anchor="middle" class="nt">(bottom end)</text>
    <!-- holes in stile bottom -->
    <ellipse cx="82" cy="90" rx="8" ry="4" fill="#7a5a2e"/>
    <ellipse cx="128" cy="90" rx="8" ry="4" fill="#7a5a2e"/>
    <text x="175" y="86" class="nt">← 2 holes drilled in the stile's end</text>
    <!-- gap arrow -->
    <line x1="105" y1="104" x2="105" y2="146" class="dim" marker-end="url(#ar)"/>
    <text x="118" y="130" class="grn">drops straight down</text>
    <!-- dowels standing in rail -->
    <rect x="82" y="150" width="12" height="34" rx="5" class="dowel"/>
    <rect x="122" y="150" width="12" height="34" rx="5" class="dowel"/>
    <text x="175" y="170" class="nt">← 2 dowels glued into the RAIL, sticking up</text>
    <!-- middle rail -->
    <rect x="0" y="184" width="300" height="70" class="rail"/>
    <text x="150" y="224" text-anchor="middle" class="nt">MIDDLE RAIL (glued to the cabinet — never moves)</text>
  </g>

  <rect x="560" y="915" width="420" height="230" rx="9" fill="#eef7f3" stroke="#1abc9c"/>
  <text x="580" y="943" class="ttl">Rule of thumb</text>
  <text x="580" y="972" class="nt">Anything <tspan class="grn">GLUED or permanently screwed</tspan> goes on the</text>
  <text x="580" y="992" class="nt">parts that never move — the rails.</text>
  <text x="580" y="1022" class="nt">Anything <tspan class="red">removable</tspan> lives in the stile: the 2 dowel</text>
  <text x="580" y="1042" class="nt">holes and the 2 threaded inserts.</text>
  <text x="580" y="1076" class="nt">So the stile itself has <tspan class="red">no hardware sticking out</tspan> —</text>
  <text x="580" y="1096" class="nt">just 2 holes in its bottom end and 2 brass inserts</text>
  <text x="580" y="1116" class="nt">flush in its back face. It looks like a plain post.</text>

  <line x1="34" y1="1190" x2="986" y2="1190" stroke="#d5dde2" stroke-width="1.5"/>

  <!-- ================= PANEL D — INSERT DEPTH ================= -->
  <text x="34" y="1226" class="ttl">D · Why M5 × 10 mm — it must not reach the front face</text>
  <g transform="translate(90,1245)">
    <rect x="40" y="10" width="300" height="90" class="maple"/>
    <rect x="250" y="38" width="90" height="34" class="insert"/>
    <text x="295" y="60" text-anchor="middle" class="nt" font-size="11">insert 10 mm</text>
    <line x1="40" y1="120" x2="250" y2="120" class="dim" marker-start="url(#dm)" marker-end="url(#dm)"/>
    <text x="145" y="138" text-anchor="middle" class="grn">9 mm solid maple — nothing shows ✓</text>
    <text x="10" y="30" class="nt">FRONT</text>
    <text x="10" y="48" class="nt">(doors</text>
    <text x="10" y="66" class="nt">seal here)</text>
    <text x="352" y="60" class="nt">BACK</text>
    <line x1="40" y1="10" x2="40" y2="100" stroke="#1e8449" stroke-width="3"/>
  </g>

  <!-- steps -->
  <text x="560" y="1250" class="ttl">Putting it in / taking it out</text>
  <text x="560" y="1278" class="nt"><tspan class="grn">IN:</tspan> drop the stile onto the 2 dowels → it self-aligns →</text>
  <text x="560" y="1298" class="nt">run one machine screw at the top, one at the bottom.</text>
  <text x="560" y="1326" class="nt"><tspan class="red">OUT:</tspan> undo those 2 machine screws → lift straight up</text>
  <text x="560" y="1346" class="nt">off the dowels. The plates stay on the rails.</text>
  <text x="560" y="1380" class="red">Total hardware showing from the front: none.</text>

  <line x1="34" y1="1420" x2="986" y2="1420" stroke="#d5dde2" stroke-width="1.5"/>

  <!-- order -->
  <text x="34" y="1456" class="h1">Order of work</text>
  <text x="34" y="1486" class="nt"><tspan class="ttl">1.</tspan> Dry-fit the stile centered → pencil-trace both its edges onto the rails.   <tspan class="ttl">2.</tspan> Drill 2 dowel holes in the middle rail's top edge, glue dowels in (20 mm proud).</text>
  <text x="34" y="1510" class="nt"><tspan class="ttl">3.</tspan> Transfer-mark and drill matching holes in the stile's bottom end (1 mm deeper than the dowels stick up).   <tspan class="ttl">4.</tspan> Test-drop it — should self-align.</text>
  <text x="34" y="1534" class="nt"><tspan class="ttl">5.</tspan> <tspan class="red">Practice an insert on a maple scrap</tspan>, then drill + drive the 2 real inserts in the stile's back face (12 mm deep, square to the face).</text>
  <text x="34" y="1558" class="nt"><tspan class="ttl">6.</tspan> Hold each plate across its seam, mark, screw the RAIL side down permanently.   <tspan class="ttl">7.</tspan> Machine-screw the stile side. Wiggle-test: zero movement.</text>
  <text x="34" y="1582" class="nt"><tspan class="ttl">8.</tspan> Remove the stile, shellac it separately, reinstall on the pencil lines — then gasket last.</text>
</svg>
