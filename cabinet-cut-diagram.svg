<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#34495e"/>
    </marker>
  </defs>
  <style>
    .ply   { fill:#e9d8b8; stroke:#5a4632; stroke-width:1.2; }
    .div   { fill:#d9b98a; stroke:#5a4632; stroke-width:1.2; }
    .frame { fill:#c9a063; stroke:#5a4632; stroke-width:1.2; }
    .glass { fill:#cfe8f5; stroke:#3a86a8; stroke-width:1.2; opacity:0.85; }
    .amp   { fill:#e67e22; stroke:#7a3d10; stroke-width:1.2; opacity:0.55; }
    .hole  { fill:none; stroke:#c0392b; stroke-width:1.6; stroke-dasharray:4 3; }
    .dim   { stroke:#34495e; stroke-width:1; }
    .dlbl  { fill:#34495e; font-size:12px; }
    .part  { fill:#7a2e12; font-size:13px; font-weight:bold; }
    .zone  { fill:#2c3e50; font-size:12px; font-weight:bold; letter-spacing:0.5px; }
    .ttl   { fill:#2c3e50; font-size:14px; font-weight:bold; }
    .h1    { fill:#d35400; font-size:20px; font-weight:bold; }
    .leg   { fill:#2c3e50; font-size:12.5px; }
    .legh  { fill:#34495e; font-size:13px; font-weight:bold; }
  </style>

  <text x="490" y="30" text-anchor="middle" class="h1">Climate Cabinet — Cut &amp; Layout Diagram (amp build)</text>
  <text x="490" y="48" text-anchor="middle" class="dlbl">External 40&quot; W × 23&quot; D × 85&quot; H (216 cm — fits under 86.3&quot; / 220 cm) · Baltic birch · 8 hung + 2 combo amps · cherry frame · Spanish cedar lining</text>

  <!-- ============ FRONT ELEVATION ============  s=4.2 px/in; cabinet x110..278, y80..437 (85in) -->
  <text x="194" y="70" text-anchor="middle" class="ttl">FRONT</text>
  <line x1="110" y1="74" x2="278" y2="74" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="194" y="70" text-anchor="middle" class="dlbl"></text>
  <text x="245" y="70" class="dlbl">40&quot;</text>
  <line x1="98" y1="80" x2="98" y2="437" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="92" y="258" text-anchor="middle" class="dlbl" transform="rotate(-90 92 258)">85&quot; (216 cm)</text>

  <rect x="110" y="80" width="168" height="357" class="ply"/>
  <rect x="110" y="80" width="168" height="3.15" class="ply"/>
  <text x="284" y="86" class="part">C</text>
  <rect x="110" y="433.85" width="168" height="3.15" class="ply"/>
  <text x="284" y="437" class="part">B</text>
  <rect x="110" y="80" width="3.15" height="357" class="ply"/>
  <rect x="274.85" y="80" width="3.15" height="357" class="ply"/>
  <text x="101" y="200" class="part" text-anchor="end">A</text>
  <text x="288" y="240" class="part">A</text>
  <!-- divider D : top face f=25.5 -> y329.9 -->
  <rect x="113.15" y="329.9" width="161.7" height="3.15" class="div"/>
  <text x="284" y="335" class="part">D</text>
  <!-- hanger F near vault top -->
  <rect x="119" y="88" width="150" height="24" class="frame"/>
  <text x="194" y="103" text-anchor="middle" class="dlbl">F · hanger board</text>
  <!-- two combo amps (not supplied — shown for layout) -->
  <rect x="118" y="366.05" width="77.7" height="67.8" class="amp"/>
  <rect x="203.7" y="353.65" width="71.1" height="80.2" class="amp"/>
  <text x="156" y="404" text-anchor="middle" class="dlbl" fill="#7a3d10">amp 1</text>
  <text x="239" y="398" text-anchor="middle" class="dlbl" fill="#7a3d10">amp 2</text>
  <!-- grommet (hidden) in divider -->
  <circle cx="194" cy="331.5" r="6" class="hole"/>
  <line x1="200" y1="331.5" x2="240" y2="312" class="dim" stroke="#c0392b"/>
  <text x="242" y="309" class="dlbl" fill="#c0392b">Ø2&quot; cable hole (in D)</text>
  <!-- zone labels -->
  <text x="194" y="200" text-anchor="middle" class="zone">SEALED VAULT</text>
  <text x="194" y="215" text-anchor="middle" class="dlbl">(8 instruments hang, ~58.75&quot; clear)</text>
  <text x="194" y="335" text-anchor="middle" class="zone" dy="6"> </text>
  <text x="194" y="345" text-anchor="middle" class="zone">OPEN AMP ZONE</text>
  <text x="194" y="359" text-anchor="middle" class="dlbl">(2 combo amps · vented · 24&quot;)</text>
  <!-- amp-zone height dim -->
  <line x1="126" y1="333.05" x2="126" y2="433.85" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="131" y="388" class="dlbl">24&quot;</text>
  <!-- divider position note -->
  <line x1="113.15" y1="331.5" x2="60" y2="331.5" class="dim"/>
  <text x="58" y="328" text-anchor="end" class="dlbl">divider top</text>
  <text x="58" y="342" text-anchor="end" class="dlbl">25.5&quot; up</text>

  <!-- ============ SIDE SECTION ============ x360..456.6 -->
  <text x="408" y="70" text-anchor="middle" class="ttl">SIDE (section)</text>
  <line x1="360" y1="74" x2="456.6" y2="74" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="408" y="70" text-anchor="middle" class="dlbl">23&quot;</text>

  <rect x="360" y="80" width="96.6" height="357" fill="#f4ecda" stroke="#5a4632" stroke-width="1.2"/>
  <rect x="360" y="80" width="96.6" height="3.15" class="ply"/>
  <rect x="360" y="433.85" width="96.6" height="3.15" class="ply"/>
  <rect x="454.5" y="80" width="2.1" height="357" class="ply"/>
  <text x="462" y="250" class="part">E</text>
  <text x="462" y="264" class="dlbl">back ½&quot;</text>
  <rect x="360" y="329.9" width="94.5" height="3.15" class="div"/>
  <text x="352" y="335" text-anchor="end" class="part">D</text>
  <circle cx="444" cy="331.5" r="4.5" class="hole"/>
  <line x1="444" y1="331.5" x2="444" y2="298" class="dim" stroke="#c0392b"/>
  <text x="444" y="294" text-anchor="middle" class="dlbl" fill="#c0392b">Ø2&quot; hole,</text>
  <text x="444" y="308" text-anchor="middle" class="dlbl" fill="#c0392b">2.5&quot; from rear</text>
  <text x="366" y="428" class="dlbl">front (door)</text>
  <text x="408" y="200" text-anchor="middle" class="zone">VAULT</text>
  <text x="408" y="388" text-anchor="middle" class="zone">AMPS</text>

  <!-- ============ DOOR & FACE FRAME ============ x560..728 -->
  <text x="644" y="70" text-anchor="middle" class="ttl">DOOR &amp; FACE FRAME</text>
  <rect x="560" y="80" width="6.3" height="357" class="frame"/>
  <rect x="721.7" y="80" width="6.3" height="357" class="frame"/>
  <text x="548" y="210" text-anchor="end" class="part">J1</text>
  <rect x="566.3" y="80" width="155.4" height="6.3" class="frame"/>
  <rect x="566.3" y="329.9" width="155.4" height="6.3" class="frame"/>
  <rect x="566.3" y="430.7" width="155.4" height="6.3" class="frame"/>
  <text x="736" y="88" class="part">J2</text>
  <text x="736" y="338" class="part">J2</text>
  <text x="736" y="437" class="part">J2</text>
  <!-- vault door: frame G/H + glazing (vault opening y86.3..329.9) -->
  <rect x="566.3" y="86.3" width="155.4" height="243.6" class="frame"/>
  <rect x="577" y="97" width="134" height="222" class="glass"/>
  <text x="644" y="205" text-anchor="middle" class="dlbl" fill="#1f6b8c">UV glazing</text>
  <text x="644" y="220" text-anchor="middle" class="dlbl" fill="#1f6b8c">(order separately)</text>
  <line x1="572" y1="190" x2="610" y2="190" class="dim"/>
  <text x="614" y="194" class="part">G</text>
  <line x1="644" y1="92" x2="644" y2="120" class="dim"/>
  <text x="650" y="110" class="part">H</text>
  <text x="644" y="382" text-anchor="middle" class="dlbl">amp zone —</text>
  <text x="644" y="396" text-anchor="middle" class="dlbl">open / vented (no door)</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="540" width="900" height="300" rx="8" fill="#f9fbfb" stroke="#bdc3c7"/>
  <text x="56" y="563" class="legh">PARTS LIST  (dimensions in inches; W × H for uprights, W × D for shelves)</text>

  <text x="56" y="588" class="legh">Baltic birch plywood — ¾″ (carcass) &amp; ½″ (back)</text>
  <text x="56" y="610" class="leg">A · Side panel ×2 — 22.5 D × 85 H — ¾″ Baltic birch</text>
  <text x="56" y="630" class="leg">B · Bottom ×1 — 38.5 W × 22.5 D — ¾″ Baltic birch</text>
  <text x="56" y="650" class="leg">C · Top ×1 — 38.5 W × 22.5 D — ¾″ Baltic birch</text>
  <text x="56" y="670" class="leg">D · Divider / middle shelf ×1 — 38.5 W × 22.5 D — ¾″ Baltic birch</text>
  <text x="56" y="690" class="leg">E · Back ×1 — 40 W × 85 H — ½″ Baltic birch</text>
  <text x="56" y="710" class="leg">F · Hanger board ×1 — 36 W × 6 H — ¾″ Baltic birch</text>
  <text x="56" y="736" class="legh" fill="#c0392b">Pre-cut hole</text>
  <text x="56" y="756" class="leg" fill="#c0392b">Ø2″ in Divider D — centered, 2.5″ from rear edge</text>

  <text x="510" y="588" class="legh">Solid hardwood — CHERRY (door + face frame)</text>
  <text x="510" y="610" class="leg">G · Door stile ×2 — 2.5 W × 57 L (trim to fit)</text>
  <text x="510" y="630" class="leg">H · Door rail ×2 — 2.5 W × 35 L (trim to fit)</text>
  <text x="510" y="650" class="leg">J1 · Face-frame stile ×2 — 1.5 W × 85 L</text>
  <text x="510" y="670" class="leg">J2 · Face-frame rail ×3 — 1.5 W × 37 L</text>
  <text x="510" y="700" class="legh" fill="#2e7d32">Interior lining — Spanish cedar (~¼″)</text>
  <text x="510" y="720" class="leg">Line vault walls + back + floor · fit/trim on site · leave bare</text>
  <text x="510" y="748" class="legh">Notes</text>
  <text x="510" y="768" class="leg">Glazing (UV acrylic/glass ~37 × 52) ordered separately — not wood.</text>
  <text x="510" y="788" class="leg">Optional foil/foam thermal break under D (amps below vault).</text>
</svg>
