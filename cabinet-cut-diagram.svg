<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" font-family="'Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#34495e"/>
    </marker>
  </defs>
  <style>
    .ply   { fill:#e9d8b8; stroke:#5a4632; stroke-width:1.2; }
    .div   { fill:#d9b98a; stroke:#5a4632; stroke-width:1.2; }
    .frame { fill:#c9a063; stroke:#5a4632; stroke-width:1.2; }
    .glass { fill:#cfe8f5; stroke:#3a86a8; stroke-width:1.2; opacity:0.85; }
    .hole  { fill:none; stroke:#c0392b; stroke-width:1.6; stroke-dasharray:4 3; }
    .dim   { stroke:#34495e; stroke-width:1; }
    .dlbl  { fill:#34495e; font-size:12px; }
    .part  { fill:#7a2e12; font-size:13px; font-weight:bold; }
    .zone  { fill:#2c3e50; font-size:12px; font-weight:bold; letter-spacing:0.5px; }
    .ttl   { fill:#2c3e50; font-size:14px; font-weight:bold; }
    .h1    { fill:#d35400; font-size:20px; font-weight:bold; }
    .lead  { fill:#c0392b; stroke:#c0392b; stroke-width:1; }
    .leg   { fill:#2c3e50; font-size:12.5px; }
    .legh  { fill:#34495e; font-size:13px; font-weight:bold; }
  </style>

  <text x="490" y="30" text-anchor="middle" class="h1">Climate Cabinet — Cut &amp; Layout Diagram</text>
  <text x="490" y="48" text-anchor="middle" class="dlbl">External 40&quot; W × 23&quot; D × 72&quot; H (183 cm — fits under 220 cm) · Baltic birch carcass · cherry door/frame · Spanish cedar lining · all 8 hung, no amps</text>

  <!-- ============ FRONT ELEVATION ============  scale 4.5 px/in; cabinet x110..290, y90..414 (72in) -->
  <text x="200" y="74" text-anchor="middle" class="ttl">FRONT</text>
  <line x1="110" y1="84" x2="290" y2="84" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="200" y="80" text-anchor="middle" class="dlbl">40&quot;</text>
  <line x1="98" y1="90" x2="98" y2="414" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="92" y="252" text-anchor="middle" class="dlbl" transform="rotate(-90 92 252)">72&quot; (183 cm)</text>

  <rect x="110" y="90" width="180" height="324" class="ply"/>
  <rect x="110" y="90" width="180" height="3.375" class="ply"/>
  <text x="296" y="95" class="part">C</text>
  <rect x="110" y="410.625" width="180" height="3.375" class="ply"/>
  <text x="296" y="414" class="part">B</text>
  <rect x="110" y="90" width="3.375" height="324" class="ply"/>
  <rect x="286.625" y="90" width="3.375" height="324" class="ply"/>
  <text x="100" y="200" class="part" text-anchor="end">A</text>
  <text x="300" y="240" class="part">A</text>
  <!-- divider D : top face f=13.5 -> y353.25, thickness 3.375 -->
  <rect x="113.375" y="353.25" width="173.25" height="3.375" class="div"/>
  <text x="296" y="358" class="part">D</text>
  <!-- hanger F near vault top -->
  <rect x="119" y="100" width="162" height="27" class="frame"/>
  <text x="200" y="117" text-anchor="middle" class="dlbl">F · hanger board</text>
  <!-- grommet (hidden) in divider -->
  <circle cx="200" cy="354.9" r="6" class="hole"/>
  <line x1="206" y1="354.9" x2="246" y2="335" class="lead"/>
  <text x="248" y="332" class="dlbl" fill="#c0392b">Ø2&quot; cable hole (in D)</text>
  <!-- zone labels -->
  <text x="200" y="223" text-anchor="middle" class="zone">SEALED VAULT</text>
  <text x="200" y="238" text-anchor="middle" class="dlbl">(8 instruments hang, ~58&quot; clear)</text>
  <text x="200" y="386" text-anchor="middle" class="zone">EQUIPMENT BAY</text>
  <text x="200" y="400" text-anchor="middle" class="dlbl">(open / vented · 12&quot;)</text>
  <!-- bay height dim -->
  <line x1="125" y1="356.625" x2="125" y2="410.625" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="130" y="386" class="dlbl">12&quot;</text>
  <!-- divider position note -->
  <line x1="113.375" y1="354.9" x2="60" y2="354.9" class="dim"/>
  <text x="58" y="351" text-anchor="end" class="dlbl">divider top</text>
  <text x="58" y="365" text-anchor="end" class="dlbl">13.5&quot; up</text>

  <!-- ============ SIDE SECTION ============ x380..483.5 -->
  <text x="431" y="74" text-anchor="middle" class="ttl">SIDE (section)</text>
  <line x1="380" y1="84" x2="483.5" y2="84" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="431" y="80" text-anchor="middle" class="dlbl">23&quot;</text>

  <rect x="380" y="90" width="103.5" height="324" fill="#f4ecda" stroke="#5a4632" stroke-width="1.2"/>
  <rect x="380" y="90" width="103.5" height="3.375" class="ply"/>
  <rect x="380" y="410.625" width="103.5" height="3.375" class="ply"/>
  <rect x="481.25" y="90" width="2.25" height="324" class="ply"/>
  <text x="489" y="250" class="part">E</text>
  <text x="489" y="264" class="dlbl">back ½&quot;</text>
  <rect x="380" y="353.25" width="101.25" height="3.375" class="div"/>
  <text x="372" y="358" text-anchor="end" class="part">D</text>
  <!-- grommet hole 2.5" from rear -->
  <circle cx="470" cy="354.9" r="4.5" class="hole"/>
  <line x1="470" y1="354.9" x2="470" y2="318" class="lead"/>
  <text x="470" y="314" text-anchor="middle" class="dlbl" fill="#c0392b">Ø2&quot; hole,</text>
  <text x="470" y="328" text-anchor="middle" class="dlbl" fill="#c0392b">2.5&quot; from rear</text>
  <text x="386" y="406" class="dlbl">front (door)</text>
  <text x="431" y="223" text-anchor="middle" class="zone">VAULT</text>
  <text x="431" y="386" text-anchor="middle" class="zone">BAY</text>

  <!-- ============ DOOR & FACE FRAME ============ x590..770 -->
  <text x="680" y="74" text-anchor="middle" class="ttl">DOOR &amp; FACE FRAME</text>
  <rect x="590" y="90" width="6.75" height="324" class="frame"/>
  <rect x="763.25" y="90" width="6.75" height="324" class="frame"/>
  <text x="578" y="220" text-anchor="end" class="part">J1</text>
  <rect x="596.75" y="90" width="166.5" height="6.75" class="frame"/>
  <rect x="596.75" y="353.25" width="166.5" height="6.75" class="frame"/>
  <rect x="596.75" y="407.25" width="166.5" height="6.75" class="frame"/>
  <text x="778" y="98" class="part">J2</text>
  <text x="778" y="360" class="part">J2</text>
  <text x="778" y="414" class="part">J2</text>
  <!-- vault door: frame G/H + glazing (vault opening y96.75..353.25) -->
  <rect x="596.75" y="96.75" width="166.5" height="256.5" class="frame"/>
  <rect x="608" y="108" width="144" height="234" class="glass"/>
  <text x="680" y="220" text-anchor="middle" class="dlbl" fill="#1f6b8c">UV glazing</text>
  <text x="680" y="235" text-anchor="middle" class="dlbl" fill="#1f6b8c">(order separately)</text>
  <line x1="602" y1="200" x2="640" y2="200" class="dim"/>
  <text x="644" y="204" class="part">G</text>
  <line x1="680" y1="102" x2="680" y2="130" class="dim"/>
  <text x="686" y="120" class="part">H</text>
  <text x="680" y="386" text-anchor="middle" class="dlbl">equipment bay —</text>
  <text x="680" y="400" text-anchor="middle" class="dlbl">open / vented (no door)</text>

  <!-- ============ LEGEND ============ -->
  <rect x="40" y="540" width="900" height="262" rx="8" fill="#f9fbfb" stroke="#bdc3c7"/>
  <text x="56" y="563" class="legh">PARTS LIST  (dimensions in inches; W × H for uprights, W × D for shelves)</text>

  <text x="56" y="588" class="legh">Baltic birch plywood — ¾″ (carcass) &amp; ½″ (back)</text>
  <text x="56" y="610" class="leg">A · Side panel ×2 — 22.5 D × 72 H — ¾″ Baltic birch</text>
  <text x="56" y="630" class="leg">B · Bottom ×1 — 38.5 W × 22.5 D — ¾″ Baltic birch</text>
  <text x="56" y="650" class="leg">C · Top ×1 — 38.5 W × 22.5 D — ¾″ Baltic birch</text>
  <text x="56" y="670" class="leg">D · Divider / middle shelf ×1 — 38.5 W × 22.5 D — ¾″ Baltic birch</text>
  <text x="56" y="690" class="leg">E · Back ×1 — 40 W × 72 H — ½″ Baltic birch</text>
  <text x="56" y="710" class="leg">F · Hanger board ×1 — 36 W × 6 H — ¾″ Baltic birch</text>

  <text x="510" y="588" class="legh">Solid hardwood — CHERRY (door + face frame)</text>
  <text x="510" y="610" class="leg">G · Door stile ×2 — 2.5 W × 56 L (trim to fit)</text>
  <text x="510" y="630" class="leg">H · Door rail ×2 — 2.5 W × 35 L (trim to fit)</text>
  <text x="510" y="650" class="leg">J1 · Face-frame stile ×2 — 1.5 W × 72 L</text>
  <text x="510" y="670" class="leg">J2 · Face-frame rail ×3 — 1.5 W × 37 L</text>
  <text x="510" y="696" class="legh" fill="#c0392b">Pre-cut hole</text>
  <text x="510" y="714" class="leg" fill="#c0392b">Ø2″ in Divider D — centered, 2.5″ from rear edge</text>
  <text x="510" y="742" class="legh" fill="#2e7d32">Interior lining — Spanish cedar (~¼″)</text>
  <text x="510" y="760" class="leg">Line vault walls + back + floor · fit/trim on site · leave bare (no finish)</text>
  <text x="510" y="782" class="leg">Glazing (UV acrylic/glass) ordered separately — not wood.</text>
</svg>
